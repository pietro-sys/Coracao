  <style>

    *{

<body>

<!-- LOGIN -->

<div id="auth">

  <div class="auth-card">

    <div class="auth-heart">❤️</div>

    <h1 class="auth-title">
      Lugar especial
    </h1>

    <p class="auth-sub">

    </p>

      >
    </div>

        placeholder="Senha secreta"

    </button>

  </div>

</div>

<!-- MAIN -->

<div id="main">

  <canvas id="c"></canvas>

  <button id="btn">
    ❤️ Reiniciar
  </button>

</div>

<script>

/* LOGIN */

const ALLOWED_NAME = 'emily';
const SECRET_PASS = 'fedida';

const authEl =
  document.getElementById('auth');

const mainEl =
  document.getElementById('main');

const nameInput =
  document.getElementById('name-input');

const passInput =
  document.getElementById('pass-input');

const enterBtn =
  document.getElementById('enter-btn');

const errorMsg =
  document.getElementById('error-msg');

function shake(el){

  el.classList.remove('error');

  void el.offsetWidth;

  el.classList.add('error');

  setTimeout(()=>{
    el.classList.remove('error');
  },400);
}

function tryEnter(){

  const name =
    nameInput.value
    .trim()
    .toLowerCase();

  const pass =
    passInput.value.trim();

  if(name !== ALLOWED_NAME){

    shake(nameInput);

    errorMsg.textContent =
      'Esse nome não está na lista ❤️';

    return;
  }

  if(pass !== SECRET_PASS){

    shake(passInput);

    errorMsg.textContent =
      'Senha incorreta 🔐';

    return;
  }

  errorMsg.textContent = '';

  authEl.classList.add('hide');

  setTimeout(()=>{

    authEl.style.display = 'none';

    mainEl.style.display = 'flex';

    startAnimation();

  },800);
}

enterBtn.addEventListener(
  'click',
  tryEnter
);

[nameInput,passInput].forEach(el=>{

  el.addEventListener('keydown',e=>{

    if(e.key === 'Enter'){
      tryEnter();
    }

  });

});

/* ANIMAÇÃO */

function startAnimation(){

  const canvas =
    document.getElementById('c');

  const ctx =
    canvas.getContext('2d');

  const W =
    Math.min(window.innerWidth,560);

  const H =
    Math.min(window.innerHeight - 80,560);

  canvas.width = W;
  canvas.height = H;

  const CX = W / 2;
  const CY = H / 2 + 20;

  function heartX(t){
    return 16 * Math.pow(Math.sin(t),3);
  }

  function heartY(t){
    return -(
      13 * Math.cos(t)
      - 5 * Math.cos(2*t)
      - 2 * Math.cos(3*t)
      - Math.cos(4*t)
    );
  }

  const SCALE = W / 58;

  function getHeartPoints(n,scale=1){

    const pts = [];

    for(let i=0;i<n;i++){

      const t =
        (i/n) * Math.PI * 2;

      pts.push({

        x:
          CX +
          heartX(t)
          * SCALE
          * scale,

        y:
          CY +
          heartY(t)
          * SCALE
          * scale

      });

    }

    return pts;
  }

  const heartPts =
    getHeartPoints(520);

  /* CORAÇÕES PULSANDO */

  class PulseHeart{

    constructor(){

      this.scale = 1;
      this.alpha = 1;
    }

    update(){

      this.scale += 0.02;

      this.alpha -= 0.012;
    }

    draw(){

      const pts =
        getHeartPoints(
          520,
          this.scale
        );

      ctx.beginPath();

      pts.forEach((p,i)=>{

        if(i === 0){

          ctx.moveTo(
            p.x,
            p.y
          );

        } else {

          ctx.lineTo(
            p.x,
            p.y
          );
        }
      });

      ctx.closePath();

      ctx.strokeStyle =
        `rgba(255,0,0,${this.alpha})`;

      ctx.lineWidth = 2;

      ctx.shadowColor = '#ff0000';

      ctx.shadowBlur = 18;

      ctx.stroke();

      ctx.shadowBlur = 0;
    }
  }

  /* ROCKET */

  class Rocket {

    constructor(target, delay){

      this.target = target;
      this.delay = delay;

      this.sx =
        CX +
        (Math.random() - 0.5)
        * W * 0.35;

      this.sy = H + 20;

      this.x = this.sx;
      this.y = this.sy;

      this.progress = 0;

      this.arrived = false;

      this.totalFrames =
        45 + Math.random() * 18;

      this.trail = [];

      this.maxTrail = 18;
    }

    update(frame){

      if(frame < this.delay) return;

      if(this.arrived) return;

      this.progress++;

      const t = Math.min(
        this.progress /
        this.totalFrames,
        1
      );

      const ease =
        t < 0.5
        ? 2 * t * t
        : -1 + (4 - 2 * t) * t;

      this.trail.push({
        x:this.x,
        y:this.y
      });

      if(this.trail.length >
        this.maxTrail){

        this.trail.shift();
      }

      this.x =
        this.sx +
        (this.target.x - this.sx)
        * ease;

      this.y =
        this.sy +
        (this.target.y - this.sy)
        * ease;

      if(t >= 1){
        this.arrived = true;
      }
    }

    draw(){

      // RASTRO

      for(let i=0;
        i<this.trail.length;
        i++){

        const p =
          this.trail[i];

        const alpha =
          i / this.trail.length;

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          alpha * 3,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          '#ff2222';

        ctx.globalAlpha =
          alpha * 0.55;

        ctx.fill();
      }

      // GLOW

      ctx.beginPath();

      ctx.arc(
        this.x,
        this.y,
        7,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        '#ff6666';

      ctx.globalAlpha = 0.15;

      ctx.fill();

      // NÚCLEO

      ctx.beginPath();

      ctx.arc(
        this.x,
        this.y,
        2.5,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = '#fff';

      ctx.globalAlpha = 1;

      ctx.fill();
    }
  }

  let rockets = [];
  let pulseHearts = [];

  let frame = 0;

  let nameAlpha = 0;

  let lastPulse = 0;

  function init(){

    rockets = [];
    pulseHearts = [];

    frame = 0;

    nameAlpha = 0;

    heartPts.forEach((pt,i)=>{

      rockets.push(
        new Rocket(pt,i*0.8)
      );

    });

    loop();
  }

  function allArrived(){

    return rockets.every(
      r => r.arrived
    );
  }

  function drawName(){

    ctx.save();

    ctx.globalAlpha =
      nameAlpha;

    ctx.textAlign = 'center';

    ctx.font =
      `italic ${W*0.11}px Playfair Display`;

    ctx.fillStyle = '#ff4d4d';

    ctx.shadowColor = '#ff0000';

    ctx.shadowBlur = 30;

    ctx.fillText(
      'Emily',
      CX,
      CY
    );

    ctx.restore();
  }

  function loop(){

    ctx.fillStyle =
      'rgba(0,0,0,0.10)';

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    rockets.forEach(r=>{

      r.update(frame);

      if(!r.arrived){
        r.draw();
      }

    });

    /* LINHA SENDO FORMADA */

    ctx.beginPath();

    let first = true;

    rockets.forEach(r=>{

      if(r.arrived){

        if(first){

          ctx.moveTo(
            r.target.x,
            r.target.y
          );

          first = false;

        } else {

          ctx.lineTo(
            r.target.x,
            r.target.y
          );
        }
      }
    });

    ctx.shadowColor = '#ff0000';

    ctx.shadowBlur = 22;

    ctx.strokeStyle = '#ff1a1a';

    ctx.lineWidth = 2.3;

    ctx.stroke();

    ctx.shadowBlur = 0;

    /* FINAL */

    if(allArrived()){

      const pulse =
        1 +
        Math.sin(frame * 0.05)
        * 0.035;

      // cria novos corações pulsando
      if(frame - lastPulse > 28){

        lastPulse = frame;

        pulseHearts.push(
          new PulseHeart()
        );
      }

      // coração principal

      ctx.beginPath();

      heartPts.forEach((p,i)=>{

        const px =
          CX +
          (p.x - CX)
          * pulse;

        const py =
          CY +
          (p.y - CY)
          * pulse;

        if(i === 0){

          ctx.moveTo(px,py);

        } else {

          ctx.lineTo(px,py);
        }
      });

      ctx.closePath();

      ctx.shadowColor = '#ff0000';

      ctx.shadowBlur = 28;

      ctx.strokeStyle = '#ff1a1a';

      ctx.lineWidth = 2.5;

      ctx.stroke();

      ctx.shadowBlur = 0;

      // desenha ondas de coração

      pulseHearts.forEach(h=>{

        h.update();
        h.draw();

      });

      pulseHearts =
        pulseHearts.filter(
          h => h.alpha > 0
        );

      // nome

      nameAlpha =
        Math.min(
          nameAlpha + 0.02,
          1
        );

      drawName();
    }

    frame++;

    requestAnimationFrame(loop);
  }

  document
    .getElementById('btn')
    .addEventListener(
      'click',
      init
    );

  init();
}

</script>

</body>
</html>
