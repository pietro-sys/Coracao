<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Emily 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Lato', sans-serif;
    overflow: hidden;
  }

  /* ── AUTH SCREEN ── */
  #auth {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.8s ease;
  }
  #auth.hide {
    opacity: 0;
    pointer-events: none;
  }

  .auth-card {
    background: #0d0d0d;
    border: 1px solid #2a1520;
    border-radius: 20px;
    padding: 48px 40px 40px;
    width: min(360px, 90vw);
    text-align: center;
  }

  .auth-heart {
    font-size: 40px;
    margin-bottom: 16px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .auth-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: #fff;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .auth-sub {
    font-size: 13px;
    color: #555;
    margin-bottom: 32px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .input-wrap input {
    width: 100%;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    color: #fff;
    font-family: 'Lato', sans-serif;
    letter-spacing: 0.5px;
    outline: none;
    transition: border-color 0.3s;
  }
  .input-wrap input:focus { border-color: #ff4d8a55; }
  .input-wrap input.error { border-color: #ff4d4d88; animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .input-wrap input::placeholder { color: #333; }

  #enter-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #c2185b, #ff4d8a);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    margin-top: 8px;
  }
  #enter-btn:hover { opacity: 0.9; }
  #enter-btn:active { transform: scale(0.98); }

  #error-msg {
    margin-top: 14px;
    font-size: 13px;
    color: #ff5555;
    min-height: 18px;
    letter-spacing: 0.3px;
  }

  /* ── MAIN SCREEN ── */
  #main {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  canvas { display: block; }

  #btn {
    margin-top: 16px;
    padding: 10px 28px;
    background: transparent;
    border: 1px solid #ff4d8a66;
    color: #ff4d8a;
    border-radius: 30px;
    font-size: 13px;
    font-family: 'Lato', sans-serif;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: background 0.3s;
  }
  #btn:hover { background: #ff4d8a15; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-card">
    <div class="auth-heart">💗</div>
    <h1 class="auth-title">Lugar especial</h1>
    <p class="auth-sub">Só uma pessoa pode entrar aqui</p>

    <div class="input-wrap">
      <input id="name-input" type="text" placeholder="Qual é o seu nome?" autocomplete="off" />
    </div>
    <div class="input-wrap">
      <input id="pass-input" type="password" placeholder="Senha secreta" autocomplete="off" />
    </div>

    <button id="enter-btn">Entrar →</button>
    <p id="error-msg"></p>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <canvas id="c"></canvas>
  <button id="btn">🚀 Lançar novamente</button>
</div>

<script>
// ── CREDENCIAIS ──────────────────────────────────────────
const ALLOWED_NAME = 'Nome da amada';      // nome aceito (case-insensitive)
const SECRET_PASS  = 'Algo importante para ambos';       // senha — troque aqui!
// ────────────────────────────────────────────────────────

const authEl     = document.getElementById('auth');
const nameInput  = document.getElementById('name-input');
const passInput  = document.getElementById('pass-input');
const enterBtn   = document.getElementById('enter-btn');
const errorMsg   = document.getElementById('error-msg');

function tryEnter() {
  const name = nameInput.value.trim().toLowerCase();
  const pass = passInput.value.trim();

  if (name !== ALLOWED_NAME) {
    shake(nameInput);
    errorMsg.textContent = 'Hmm… esse nome não está na lista 💔';
    return;
  }
  if (pass !== SECRET_PASS) {
    shake(passInput);
    errorMsg.textContent = 'Senha incorreta, tente novamente 🔐';
    return;
  }

  // SUCCESS
  errorMsg.textContent = '';
  authEl.classList.add('hide');
  setTimeout(() => { authEl.style.display = 'none'; startAnimation(); }, 900);
}

function shake(el) {
  el.classList.remove('error');
  void el.offsetWidth;
  el.classList.add('error');
  setTimeout(() => el.classList.remove('error'), 500);
}

enterBtn.addEventListener('click', tryEnter);
[nameInput, passInput].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); }));


// ── ANIMATION ───────────────────────────────────────────
function startAnimation() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const W = Math.min(window.innerWidth, 560);
  const H = Math.min(window.innerHeight - 80, 560);
  canvas.width = W;
  canvas.height = H;

  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)); }

  const SCALE = W / 58;
  const CX = W / 2;
  const CY = H / 2 + H * 0.06;

  function getHeartPoints(n) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2;
      pts.push({ x: CX + heartX(t) * SCALE, y: CY + heartY(t) * SCALE });
    }
    return pts;
  }

  const NUM_PARTICLES = 520;
  const heartPts = getHeartPoints(NUM_PARTICLES);

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  class Rocket {
    constructor(target, delay) {
      this.target = target;
      this.delay = delay;
      this.arrived = false;
      this.sx = CX + (Math.random() - 0.5) * W * 0.35;
      this.sy = H + 10;
      this.x = this.sx; this.y = this.sy;
      this.trail = []; this.maxTrail = 18;
      this.progress = 0;
      this.totalFrames = 45 + Math.random() * 15;
      const hue = 315 + Math.random() * 55;
      const light = 60 + Math.random() * 25;
      this.color = `hsl(${hue},90%,${light}%)`;
      this.glowColor = `hsl(${hue},100%,82%)`;
      this.sparks = [];
    }

    update(fc) {
      if (fc < this.delay) return;
      if (this.arrived) {
        this.sparks = this.sparks.filter(s => s.life > 0);
        this.sparks.forEach(s => { s.x += s.vx; s.y += s.vy; s.vy += 0.08; s.life -= 3; s.vx *= 0.96; });
        return;
      }
      this.progress++;
      const t = Math.min(this.progress / this.totalFrames, 1);
      const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > this.maxTrail) this.trail.shift();
      this.x = this.sx + (this.target.x - this.sx) * ease;
      this.y = this.sy + (this.target.y - this.sy) * ease;
      if (t >= 1) { this.arrived = true; this.x = this.target.x; this.y = this.target.y; this.spawnSparks(); }
    }

    spawnSparks() {
      for (let i = 0; i < 10 + Math.random()*8; i++) {
        const a = Math.random() * Math.PI * 2, sp = 0.5 + Math.random() * 2.5;
        this.sparks.push({ x: this.x, y: this.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-1, life: 60+Math.random()*40 });
      }
    }

    draw() {
      if (!this.arrived) {
        for (let i = 0; i < this.trail.length; i++) {
          ctx.beginPath();
          ctx.arc(this.trail[i].x, this.trail[i].y, (i/this.trail.length)*2.5, 0, Math.PI*2);
          ctx.fillStyle = this.color; ctx.globalAlpha = (i/this.trail.length)*0.7; ctx.fill();
        }
        ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
        ctx.fillStyle = '#fff'; ctx.globalAlpha = 1; ctx.fill();
        ctx.beginPath(); ctx.arc(this.x, this.y, 5, 0, Math.PI*2);
        ctx.fillStyle = this.glowColor; ctx.globalAlpha = 0.5; ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
        ctx.fillStyle = this.color; ctx.globalAlpha = 0.9; ctx.fill();
        this.sparks.forEach(s => {
          ctx.beginPath(); ctx.arc(s.x, s.y, 1, 0, Math.PI*2);
          ctx.fillStyle = this.glowColor; ctx.globalAlpha = s.life/100; ctx.fill();
        });
      }
      ctx.globalAlpha = 1;
    }
  }

  // Name fade-in state
  let nameAlpha = 0;
  let nameVisible = false;

  let rockets = [], frameCount = 0, animId;

  function init() {
    cancelAnimationFrame(animId);
    frameCount = 0; rockets = []; nameAlpha = 0; nameVisible = false;
    const shuffled = shuffle([...heartPts]);
    shuffled.forEach((pt, i) => rockets.push(new Rocket(pt, Math.floor(i * 0.8))));
    loop();
  }

  function drawName(alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // glow layers
    const glowSize = W * 0.115;
    ctx.font = `italic ${glowSize}px 'Playfair Display', serif`;
    ctx.fillStyle = '#ff80aa';
    ctx.shadowColor = '#ff4d8a';
    ctx.shadowBlur = 28;
    ctx.fillText('Emily', CX, CY - 4);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function allArrived() {
    return rockets.length > 0 && rockets.every(r => r.arrived);
  }

  function loop() {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, W, H);

    rockets.forEach(r => { r.update(frameCount); r.draw(); });

    if (allArrived()) {
      nameAlpha = Math.min(nameAlpha + 0.015, 1);
    }
    if (nameAlpha > 0) drawName(nameAlpha);

    frameCount++;
    animId = requestAnimationFrame(loop);
  }

  document.getElementById('btn').addEventListener('click', init);
  init();
}
</script>
</body>
</html>
